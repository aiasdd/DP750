<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Databricks Labs</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #eef3ff;
      --ink: #1a2433;
      --ink-soft: #52627a;
      --accent: #0a6cff;
      --accent-2: #00a09d;
      --border: #dbe4f1;
      --shadow: 0 14px 34px rgba(14, 43, 85, 0.12);
      --radius-xl: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(10, 108, 255, 0.16), transparent 34%),
        radial-gradient(circle at 90% 0%, rgba(0, 160, 157, 0.15), transparent 32%),
        var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    .layout {
      width: min(1100px, calc(100% - 2.4rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    .hero {
      background: linear-gradient(130deg, #0b2f73 0%, #004ca8 48%, #0082bf 100%);
      color: #f6f9ff;
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -90px;
      top: -120px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 65%);
      pointer-events: none;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.7rem 0 0.8rem;
      line-height: 1.25;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
    }

    .hero p {
      margin: 0;
      color: #e5edff;
    }

    .hero-links {
      margin-top: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .hero-links a,
    .card-links a {
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hero-links a {
      color: #052557;
      background: #eaf2ff;
    }

    .hero-links a:hover,
    .card-links a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(5, 38, 89, 0.2);
    }

    .section-head {
      margin: 2.4rem 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .section-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .stages {
      display: grid;
      gap: 1.1rem;
    }

    .demo-stages {
      margin: 0.8rem 0;
    }

    .demo-section {
      margin-top: 2.4rem;
    }

    .stage {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.95rem;
    }

    .stage-title {
      margin: 0 0 0.7rem;
      font-size: 1rem;
      color: #123b7d;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 190px;
    }

    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink-soft);
      font-size: 0.86rem;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .card h3 {
      margin: 0;
      line-height: 1.35;
      font-size: 1rem;
    }

    .card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.92rem;
      flex: 1;
    }

    .card-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.2rem;
    }

    .card-links a {
      font-size: 0.85rem;
      background: var(--surface-soft);
      color: #0a3b89;
      border: 1px solid #cad9f6;
    }

    .footer-note {
      margin-top: 2.2rem;
      color: var(--ink-soft);
      font-size: 0.88rem;
      text-align: center;
    }

    .chip {
      background: #e7fbfa;
      color: #015a59;
      border: 1px solid #beeceb;
      border-radius: 999px;
      padding: 0.18rem 0.52rem;
      font-weight: 600;
      font-size: 0.78rem;
    }

    @media (max-width: 700px) {
      .layout {
        width: calc(100% - 1.2rem);
      }

      .hero {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hero">
      <h1>Azure Databricks Labs</h1>
      <p>
        Azure Databricks의 핵심 실습을 순서대로 진행할 수 있도록 구성되어 있습니다.
        환경 프로비저닝부터 워크스페이스 탐색, 컴퓨팅 구성, Unity Catalog 객체 생성/보안/거버넌스,
        그리고 Delta Lake 기반 데이터 모델링(SCD Type 2, CDF, Time Travel)까지 단계적으로 학습합니다.
      </p>
      <div class="hero-links">
      </div>
    </header>

    <section>
      <div class="section-head">
        <h2>Labs</h2>
      </div>

      <main class="stages" id="labs-stages"></main>
    </section>

    <section class="demo-section">
      <div class="section-head">
        <h2>데모 시나리오</h2>
      </div>

      <main class="stages demo-stages" id="demo-stages"></main>
    </section>

  </div>

  <script>
    const labs = [
      {
        lab: "00",
        title: "Azure Databricks 환경 설정",
        md: "00-setup.md",
        minutes: "15 min",
        note: "Azure Cloud Shell에서 스크립트를 실행해 Databricks Premium 작업 영역과 리소스 그룹을 프로비저닝합니다.",
        notebook: "01-explore-azure-databricks-KO.ipynb"
      },
      {
        lab: "01",
        title: "Azure Databricks 탐색하기",
        md: "01-explore-azure-databricks-KO.md",
        minutes: "40 min",
        note: "워크스페이스 UI를 탐색하고 Unity Catalog 볼륨에 데이터를 업로드한 뒤 Python/SQL/Markdown 노트북 작업을 익힙니다.",
        notebook: "01-explore-azure-databricks-KO.ipynb"
      },
      {
        lab: "02",
        title: "Azure Databricks에서 컴퓨트 선택 및 구성",
        md: "02-select-and-configure-compute-KO.md",
        minutes: "40 min",
        note: "다목적 클러스터를 구성하고 클러스터/노트북 범위 라이브러리를 설치해 PySpark로 합성 데이터를 생성 및 분석합니다.",
        notebook: "02-select-and-configure-compute-KO.ipynb"
      },
      {
        lab: "03",
        title: "Unity 카탈로그에서 객체 생성 및 구성",
        md: "03-create-and-organize-objects-in-unity-catalog-KO.md",
        minutes: "60 min",
        note: "카탈로그·메달리온 스키마·제약조건 테이블·뷰·볼륨·SQL 함수를 생성해 Unity Catalog 네임스페이스를 설계합니다.",
        notebook: "03-create-and-organize-objects-in-unity-catalog-KO.ipynb"
      },
      {
        lab: "04",
        title: "보안 Unity 카탈로그 객체",
        md: "04-secure-unity-catalog-objects-KO.md",
        minutes: "50 min",
        note: "그룹 권한 부여, 행 필터, 열 마스킹과 Azure Key Vault 기반 비밀 범위를 설정해 데이터 접근 보안을 구현합니다.",
        notebook: "04-secure-unity-catalog-objects-KO.ipynb"
      },
      {
        lab: "05",
        title: "Unity Catalog 개체 관리",
        md: "05-govern-unity-catalog-objects-KO.md",
        minutes: "50 min",
        note: "태그/주석 관리, Delta 보존 정책과 VACUUM, 계보·감사 로그 쿼리로 거버넌스와 규정 준수 추적을 수행합니다.",
        notebook: "05-govern-unity-catalog-objects-KO.ipynb"
      },
      {
        lab: "06",
        title: "Azure Databricks를 사용한 데이터 모델링 설계 및 구현",
        md: "06-design-implement-data-modeling-unity-catalog-KO.md",
        minutes: "50 min",
        note: "Delta Lake 모델에서 SCD Type 2, 액세스 클러스터링, Change Data Feed, Time Travel로 이력·감사·복구를 구현합니다.",
        notebook: "06-design-implement-data-modeling-unity-catalog-KO.ipynb"
      }
    ];

    const stageConfig = [
      { title: "준비", start: 0, end: 0 },
      { title: "클러스터 및 Unity Catalog", start: 1, end: 3 },
      { title: "보안 및 거버넌스", start: 4, end: 6 }
    ];

    const demoScenarios = [
      {
        title: "의료 산업 시나리오- 컴퓨팅 선택 및 구성",
        md: "22-Demo-scenario2.md",
        note: "실시간 환자 모니터링, 임상 데이터 웨어하우징, 의료 연구 분석, 규정 보고, 예측 의료 모델을 Azure Databricks에서 지원합니다."
      },
      {
        title: "대학 데이터 플랫폼",
        md: "23-Demo-scenario3.md",
        note: "교육 데이터 자산 전체에 일관된 명명 규칙을 적용하고, 대학 조직 구조에 맞는 카탈로그와 스키마를 생성하며, 정형 및 비정형 교육 데이터를 위한 테이블, 뷰, 볼륨과 셀프 서비스 분석을 구현합니다."
      },
      {
        title: "RetailNow - 옴니채널 소매업체 데이터 플랫폼",
        md: "24-Demo-scenario4.md",
        note: "Unity Catalog를 통해 테이블을 복제하거나 수십 개의 뷰를 관리하지 않고도 소매 데이터에 대한 세밀하고 통제된 액세스를 지원합니다."
      },
      {
        title: "AutoNova Group 글로벌 자동차 제조업체",
        md: "25-Demo-scenario5.md",
        note: "테이블 정의 문서화, 액세스 정책 적용, 데이터 보존 관리, 계보 추적, 액세스 감사, 딜러 파트너와의 안전한 델타 공유 전략 설계를 수행합니다."
      },
      {
        title: "금융 서비스 데이터 모델링 설계 및 구현",
        md: "26-Demo-scenario6.md",
        note: "규제 쿼리를 위한 거래 날짜별 분할, 고객 위험 등급 변경을 위한 SCD 유형 2, 감사 추적을 위한 변경 데이터 피드, 다차원 거래 분석을 위한 유동 클러스터링을 구현합니다."
      }
    ];

    const labsStages = document.getElementById("labs-stages");
    const demoStages = document.getElementById("demo-stages");

    stageConfig.forEach((stage) => {
      const section = document.createElement("section");
      section.className = "stage";

      const title = document.createElement("h3");
      title.className = "stage-title";
      title.textContent = stage.title;
      section.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";

      labs
        .filter((item) => Number(item.lab) >= stage.start && Number(item.lab) <= stage.end)
        .forEach((item) => {
          const card = document.createElement("article");
          card.className = "card";

          const badge = item.lab === "00" ? "<span class=\"chip\">Setup</span>" : `<span>${item.minutes}</span>`;

          card.innerHTML = `
            <div class="meta"><strong>Lab ${item.lab}</strong>${badge}</div>
            <h3>${item.title}</h3>
            <p>${item.note}</p>
            <div class="card-links">
              <a href="lab.html?file=Labs/${item.md}">가이드</a>
              <a href="notebook.html?file=Labs/Notebooks/${item.notebook}">노트북</a>
            </div>
          `;

          grid.appendChild(card);
        });

      section.appendChild(grid);
      labsStages.appendChild(section);
    });

    const demoGrid = document.createElement("div");
    demoGrid.className = "grid";

    demoScenarios.forEach((item) => {
      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
        <h3>${item.title}</h3>
        <p>${item.note}</p>
        <div class="card-links">
          <a href="lab.html?file=Labs/${item.md}">보기</a>
        </div>
      `;

      demoGrid.appendChild(card);
    });

    const demoBox = document.createElement("section");
    demoBox.className = "stage";

    demoBox.appendChild(demoGrid);
    demoStages.appendChild(demoBox);
  </script>
</body>
</html>
