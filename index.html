<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Databricks Labs (00-06)</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #eef3ff;
      --ink: #1a2433;
      --ink-soft: #52627a;
      --accent: #0a6cff;
      --accent-2: #00a09d;
      --border: #dbe4f1;
      --shadow: 0 14px 34px rgba(14, 43, 85, 0.12);
      --radius-xl: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(10, 108, 255, 0.16), transparent 34%),
        radial-gradient(circle at 90% 0%, rgba(0, 160, 157, 0.15), transparent 32%),
        var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    .layout {
      width: min(1100px, calc(100% - 2.4rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    .hero {
      background: linear-gradient(130deg, #0b2f73 0%, #004ca8 48%, #0082bf 100%);
      color: #f6f9ff;
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -90px;
      top: -120px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 65%);
      pointer-events: none;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.7rem 0 0.8rem;
      line-height: 1.25;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
    }

    .hero p {
      margin: 0;
      max-width: 70ch;
      color: #e5edff;
    }

    .hero-links {
      margin-top: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .hero-links a,
    .card-links a {
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hero-links a {
      color: #052557;
      background: #eaf2ff;
    }

    .hero-links a:hover,
    .card-links a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(5, 38, 89, 0.2);
    }

    .section-head {
      margin: 2.4rem 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .section-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 190px;
    }

    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink-soft);
      font-size: 0.86rem;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .card h3 {
      margin: 0;
      line-height: 1.35;
      font-size: 1rem;
    }

    .card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.92rem;
      flex: 1;
    }

    .card-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.2rem;
    }

    .card-links a {
      font-size: 0.85rem;
      background: var(--surface-soft);
      color: #0a3b89;
      border: 1px solid #cad9f6;
    }

    .footer-note {
      margin-top: 2.2rem;
      color: var(--ink-soft);
      font-size: 0.88rem;
      text-align: center;
    }

    .chip {
      background: #e7fbfa;
      color: #015a59;
      border: 1px solid #beeceb;
      border-radius: 999px;
      padding: 0.18rem 0.52rem;
      font-weight: 600;
      font-size: 0.78rem;
    }

    @media (max-width: 700px) {
      .layout {
        width: calc(100% - 1.2rem);
      }

      .hero {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hero">
      <span class="badge">GitHub Pages Ready</span>
      <h1>Azure Databricks Labs (00-06)</h1>
      <p>
        현재 실습 운영 범위에 맞춰 Labs 폴더의 MD 기준 Lab 00-06만 선별해 제공합니다.
        각 항목에서 가이드와 노트북을 바로 열어 핵심 학습 흐름을 빠르게 진행할 수 있습니다.
      </p>
      <div class="hero-links">
        <a href="Labs/00-setup.md">시작하기 (Lab 00)</a>
        <a href="Labs/Notebooks/01-explore-azure-databricks-KO.ipynb">첫 노트북 열기</a>
      </div>
    </header>

    <section>
      <div class="section-head">
        <h2>Labs</h2>
        <p>Labs 폴더의 MD 기준: Lab 00-06만 표시</p>
      </div>

      <main class="grid" id="labs-grid"></main>
    </section>

    <p class="footer-note">
      GitHub Pages에서 루트 페이지로 사용되며, 상대 경로 기반 링크를 사용합니다.
    </p>
  </div>

  <script>
    const labs = [
      {
        lab: "00",
        md: "00-setup.md",
        minutes: "Setup",
        note: "실습 환경을 준비하고 Azure Databricks 워크스페이스를 초기화합니다.",
        notebook: "01-explore-azure-databricks-KO.ipynb"
      },
      {
        lab: "01",
        md: "01-explore-azure-databricks-KO.md",
        minutes: "30 min",
        note: "워크스페이스 UI, 데이터 업로드, 노트북 기본 기능을 익힙니다.",
        notebook: "01-explore-azure-databricks-KO.ipynb"
      },
      {
        lab: "02",
        md: "02-select-and-configure-compute-KO.md",
        minutes: "30 min",
        note: "클러스터 생성, 라이브러리 설치, PySpark 기반 데이터 분석을 수행합니다.",
        notebook: "02-select-and-configure-compute-KO.ipynb"
      },
      {
        lab: "03",
        md: "03-create-and-organize-objects-in-unity-catalog-KO.md",
        minutes: "45 min",
        note: "카탈로그와 스키마를 만들고 Unity Catalog 객체를 구조화합니다.",
        notebook: "03-create-and-organize-objects-in-unity-catalog-KO.ipynb"
      },
      {
        lab: "04",
        md: "04-secure-unity-catalog-objects-KO.md",
        minutes: "45 min",
        note: "권한 제어, 행/열 보안, 비밀 관리로 데이터 보호를 적용합니다.",
        notebook: "04-secure-unity-catalog-objects-KO.ipynb"
      },
      {
        lab: "05",
        md: "05-govern-unity-catalog-objects-KO.md",
        minutes: "30 min",
        note: "태깅, 보존 정책, 계보 추적과 감사 로그 분석을 실습합니다.",
        notebook: "05-govern-unity-catalog-objects-KO.ipynb"
      },
      {
        lab: "06",
        md: "06-design-implement-data-modeling-unity-catalog-KO.md",
        minutes: "45 min",
        note: "Delta Lake 기반 데이터 모델링과 이력 관리, 시간 여행을 다룹니다.",
        notebook: "06-design-implement-data-modeling-unity-catalog-KO.ipynb"
      }
    ];

    const labsGrid = document.getElementById("labs-grid");

    labs.forEach((item) => {
      const card = document.createElement("article");
      card.className = "card";

      const badge = item.lab === "00" ? "<span class=\"chip\">Setup</span>" : `<span>${item.minutes}</span>`;

      card.innerHTML = `
        <div class="meta"><strong>Lab ${item.lab}</strong>${badge}</div>
        <h3>${item.md}</h3>
        <p>${item.note}</p>
        <div class="card-links">
          <a href="Labs/${item.md}">가이드</a>
          <a href="Labs/Notebooks/${item.notebook}">노트북</a>
        </div>
      `;

      labsGrid.appendChild(card);
    });
  </script>
</body>
</html>
