<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notebook Viewer</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --ink: #1b2432;
      --ink-soft: #5a6b84;
      --border: #dbe4f1;
      --accent: #0a6cff;
      --code-bg: #0f1724;
      --code-ink: #eef5ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .layout {
      width: min(1050px, calc(100% - 2rem));
      margin: 1.2rem auto 2.5rem;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .topbar a {
      text-decoration: none;
      color: #0a3b89;
      font-weight: 600;
    }

    .path {
      color: var(--ink-soft);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .summary {
      color: var(--ink-soft);
      font-size: 0.92rem;
      margin: 0 0 0.8rem;
    }

    .cells {
      display: grid;
      gap: 0.85rem;
    }

    .cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem;
    }

    .cell-head {
      font-size: 0.78rem;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .cell-body {
      line-height: 1.7;
      overflow-x: auto;
    }

    .cell-body h1,
    .cell-body h2,
    .cell-body h3,
    .cell-body h4 {
      line-height: 1.3;
      margin-top: 0.5rem;
    }

    .cell-body table {
      border-collapse: collapse;
      width: 100%;
    }

    .cell-body th,
    .cell-body td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      text-align: left;
    }

    .cell-body pre {
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: 10px;
      padding: 0.8rem;
      overflow-x: auto;
    }

    .cell-body code {
      background: #eef3ff;
      border-radius: 4px;
      padding: 0.08rem 0.3rem;
    }

    .cell-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .error {
      color: #b00020;
      font-weight: 700;
      background: #fff1f4;
      border: 1px solid #f4beca;
      border-radius: 10px;
      padding: 0.8rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="layout">
    <div class="topbar">
      <a href="./index.html">메인으로 돌아가기</a>
      <span class="path" id="doc-path"></span>
    </div>

    <p class="summary" id="summary"></p>
    <section class="cells" id="cells"></section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "";
    const pathNode = document.getElementById("doc-path");
    const cellsRoot = document.getElementById("cells");
    const summary = document.getElementById("summary");

    const isAllowedPath = file.startsWith("Labs/Notebooks/") && file.endsWith(".ipynb") && !file.includes("..");

    function toText(source) {
      if (Array.isArray(source)) {
        return source.join("");
      }
      return typeof source === "string" ? source : "";
    }

    function showError(message) {
      cellsRoot.innerHTML = `<div class="error">${message}</div>`;
      summary.textContent = "";
    }

    if (!isAllowedPath) {
      showError("잘못된 노트북 경로입니다.");
      throw new Error("Invalid notebook path");
    }

    pathNode.textContent = file;

    fetch(file)
      .then((response) => {
        if (!response.ok) {
          throw new Error("노트북 파일을 불러오지 못했습니다.");
        }
        return response.json();
      })
      .then((notebook) => {
        const cells = Array.isArray(notebook.cells) ? notebook.cells : [];
        summary.textContent = `총 ${cells.length}개 셀`;

        if (cells.length === 0) {
          showError("노트북 셀이 없습니다.");
          return;
        }

        cells.forEach((cell, index) => {
          const wrap = document.createElement("article");
          wrap.className = "cell";

          const head = document.createElement("div");
          head.className = "cell-head";
          const type = cell.cell_type === "code" ? "Code" : "Markdown";
          head.textContent = `Cell ${index + 1} · ${type}`;

          const body = document.createElement("div");
          body.className = "cell-body";

          const source = toText(cell.source);
          if (cell.cell_type === "markdown") {
            body.innerHTML = marked.parse(source);
          } else {
            const lang = (cell.metadata && cell.metadata.language) ? String(cell.metadata.language) : "python";
            body.innerHTML = `<pre><code class="language-${lang}"></code></pre>`;
            body.querySelector("code").textContent = source;
          }

          wrap.appendChild(head);
          wrap.appendChild(body);
          cellsRoot.appendChild(wrap);
        });
      })
      .catch((error) => {
        showError(error.message);
      });
  </script>
</body>
</html>
