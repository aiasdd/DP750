<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notebook Viewer</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --ink: #1b2432;
      --ink-soft: #5a6b84;
      --border: #dbe4f1;
      --accent: #0a6cff;
      --code-bg: #0f1724;
      --code-ink: #eef5ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .layout {
      width: min(1320px, calc(100% - 2rem));
      margin: 1.2rem auto 2.5rem;
    }

    .main-container {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }

    .toc-sidebar {
      flex: 0 0 240px;
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
    }

    .content-area {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .topbar a {
      text-decoration: none;
      color: #0a3b89;
      font-weight: 600;
    }

    .path {
      color: var(--ink-soft);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .summary {
      color: var(--ink-soft);
      font-size: 0.92rem;
      margin: 0 0 0.8rem;
    }

    .cells {
      display: grid;
      gap: 0.85rem;
    }

    .cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem;
    }

    .cell-head {
      font-size: 0.78rem;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .cell-body {
      line-height: 1.7;
      overflow-x: auto;
    }

    .cell-body h1,
    .cell-body h2,
    .cell-body h3,
    .cell-body h4 {
      line-height: 1.3;
      margin-top: 0.5rem;
    }

    .cell-body table {
      border-collapse: collapse;
      width: 100%;
    }

    .cell-body th,
    .cell-body td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      text-align: left;
    }

    .cell-body pre {
      background: var(--code-bg);
      color: var(--code-ink);
      border-radius: 10px;
      padding: 0.8rem;
      overflow-x: auto;
    }

    .cell-body code {
      background: #eef3ff;
      border-radius: 4px;
      padding: 0.08rem 0.3rem;
    }

    .cell-body pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .error {
      color: #b00020;
      font-weight: 700;
      background: #fff1f4;
      border: 1px solid #f4beca;
      border-radius: 10px;
      padding: 0.8rem;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.8rem;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--ink-soft);
      font-weight: 600;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    .toc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .cell-body img {
      max-width: 100%;
      height: auto;
      display: block;
    }


    .toc-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.8rem;
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .toc-item {
      margin: 0;
      padding: 0;
    }

    .toc-link {
      display: block;
      padding: 0.35rem 0;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      line-height: 1.5;
      border-left: 2px solid transparent;
      padding-left: 0.5rem;
      transition: all 0.15s;
    }

    .toc-link:hover {
      color: #0054cc;
      border-left-color: var(--accent);
    }

    .toc-link.level-1 {
      margin-left: 0;
      font-weight: 600;
    }

    .toc-link.level-2 {
      margin-left: 0.8rem;
    }

    .toc-link.level-3 {
      margin-left: 1.6rem;
    }

    .cell-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .cell-head-label {
      flex: 1;
    }

    .collapse-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-size: 1rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      transition: transform 0.2s;
    }

    .collapse-btn:hover {
      opacity: 0.8;
    }

    .collapse-btn.collapsed {
      transform: rotate(-90deg);
    }

    .cell-body.collapsed {
      display: none;
    }

    .cell.hidden {
      display: none;
    }
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .toc-sidebar {
        flex: 1 1 auto;
        position: static;
        max-height: 300px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="layout">
    <div class="topbar">
      <a href="./index.html">메인으로 돌아가기</a>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">모두</button>
        <button class="filter-btn" data-filter="code">코드만</button>
        <button class="filter-btn" data-filter="markdown">마크다운만</button>
      </div>
    </div>

    <div class="main-container">
      <aside class="toc-sidebar">
        <nav class="toc" id="toc" style="display: none;">
          <div class="toc-title">목차</div>
          <ul class="toc-list" id="toc-list"></ul>
        </nav>
      </aside>

      <section class="content-area">
        <p class="summary" id="summary"></p>
        <section class="cells" id="cells"></section>
      </section>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "";
    const cellsRoot = document.getElementById("cells");
    const summary = document.getElementById("summary");
    const tocNav = document.getElementById("toc");
    const tocList = document.getElementById("toc-list");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let currentFilter = "all";
    let allCells = [];
    const headings = [];

    const isAllowedPath = file.startsWith("Labs/Notebooks/") && file.endsWith(".ipynb") && !file.includes("..");

    function toText(source) {
      if (Array.isArray(source)) {
        return source.join("");
      }
      return typeof source === "string" ? source : "";
    }

    function showError(message) {
      cellsRoot.innerHTML = `<div class="error">${message}</div>`;
      summary.textContent = "";
      tocNav.style.display = "none";
    }

    function extractHeadings(html, cellIndex) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      const headingElements = temp.querySelectorAll("h1, h2, h3, h4");
      headingElements.forEach((h, idx) => {
        const level = parseInt(h.tagName[1]);
        const id = `heading-${cellIndex}-${idx}`;
        h.id = id;
        headings.push({
          id,
          level,
          text: h.textContent,
          element: h,
        });
      });
      return temp.innerHTML;
    }

    function renderTOC() {
      if (headings.length === 0) {
        tocNav.style.display = "none";
        return;
      }

      tocNav.style.display = "block";
      tocList.innerHTML = "";

      headings.forEach((h) => {
        const li = document.createElement("li");
        li.className = "toc-item";
        const a = document.createElement("a");
        a.href = `#${h.id}`;
        a.className = `toc-link level-${h.level}`;
        a.textContent = h.text;
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    function applyFilter(filter) {
      currentFilter = filter;
      allCells.forEach((cell) => {
        if (filter === "all") {
          cell.classList.remove("hidden");
        } else if (filter === "code") {
          cell.classList.toggle("hidden", cell.dataset.type !== "code");
        } else if (filter === "markdown") {
          cell.classList.toggle("hidden", cell.dataset.type !== "markdown");
        }
      });
    }

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        applyFilter(btn.dataset.filter);
      });
    });

    if (!isAllowedPath) {
      showError("잘못된 노트북 경로입니다.");
      throw new Error("Invalid notebook path");
    }

    fetch(file)
      .then((response) => {
        if (!response.ok) {
          throw new Error("노트북 파일을 불러오지 못했습니다.");
        }
        return response.json();
      })
      .then((notebook) => {
        const cells = Array.isArray(notebook.cells) ? notebook.cells : [];
        summary.textContent = `총 ${cells.length}개 셀`;

        if (cells.length === 0) {
          showError("노트북 셀이 없습니다.");
          return;
        }

        cells.forEach((cell, index) => {
          const wrap = document.createElement("article");
          wrap.className = "cell";
          wrap.dataset.type = cell.cell_type;

          const head = document.createElement("div");
          head.className = "cell-head";
          const type = cell.cell_type === "code" ? "Code" : "Markdown";

          const label = document.createElement("div");
          label.className = "cell-head-label";
          label.textContent = `Cell ${index + 1} · ${type}`;

          head.appendChild(label);

          if (cell.cell_type === "code") {
            const collapseBtn = document.createElement("button");
            collapseBtn.className = "collapse-btn";
            collapseBtn.innerHTML = "▼";
            collapseBtn.addEventListener("click", () => {
              const body = wrap.querySelector(".cell-body");
              body.classList.toggle("collapsed");
              collapseBtn.classList.toggle("collapsed");
            });
            head.appendChild(collapseBtn);
          }

          const body = document.createElement("div");
          body.className = "cell-body";

          const source = toText(cell.source);
          if (cell.cell_type === "markdown") {
            let html = marked.parse(source);
            html = extractHeadings(html, index);
            body.innerHTML = html;
          } else {
            const lang = (cell.metadata && cell.metadata.language) ? String(cell.metadata.language) : "python";
            body.innerHTML = `<pre><code class="language-${lang}"></code></pre>`;
            body.querySelector("code").textContent = source;
          }

          wrap.appendChild(head);
          wrap.appendChild(body);
          cellsRoot.appendChild(wrap);
          allCells.push(wrap);
        });

        renderTOC();
      })
      .catch((error) => {
        showError(error.message);
      });
  </script>
</body>
</html>
