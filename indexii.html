<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Databricks Labs (07~13)</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-soft: #eef3ff;
      --ink: #1a2433;
      --ink-soft: #52627a;
      --accent: #0a6cff;
      --accent-2: #00a09d;
      --border: #dbe4f1;
      --shadow: 0 14px 34px rgba(14, 43, 85, 0.12);
      --radius-xl: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(10, 108, 255, 0.16), transparent 34%),
        radial-gradient(circle at 90% 0%, rgba(0, 160, 157, 0.15), transparent 32%),
        var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    .layout {
      width: min(1100px, calc(100% - 2.4rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    .hero {
      background: linear-gradient(130deg, #0b2f73 0%, #004ca8 48%, #0082bf 100%);
      color: #f6f9ff;
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -90px;
      top: -120px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 65%);
      pointer-events: none;
    }

    h1 {
      margin: 0.7rem 0 0.8rem;
      line-height: 1.25;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
      position: relative;
      z-index: 1;
    }

    .hero p {
      margin: 0;
      color: #e5edff;
      position: relative;
      z-index: 1;
    }

    .section-head {
      margin: 2.4rem 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .section-head p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .stages {
      display: grid;
      gap: 1.1rem;
    }

    .stage {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.95rem;
    }

    .stage-title {
      margin: 0 0 0.7rem;
      font-size: 1rem;
      color: #123b7d;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 190px;
    }

    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink-soft);
      font-size: 0.86rem;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .card h3 {
      margin: 0;
      line-height: 1.35;
      font-size: 1rem;
    }

    .card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.92rem;
      flex: 1;
    }

    .card-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.2rem;
    }

    .card-links a {
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      background: var(--surface-soft);
      color: #0a3b89;
      border: 1px solid #cad9f6;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-links a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(5, 38, 89, 0.2);
    }

    .chip {
      background: #e7fbfa;
      color: #015a59;
      border: 1px solid #beeceb;
      border-radius: 999px;
      padding: 0.18rem 0.52rem;
      font-weight: 600;
      font-size: 0.78rem;
    }

    @media (max-width: 700px) {
      .layout {
        width: calc(100% - 1.2rem);
      }

      .hero {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hero">
      <h1>Azure Databricks Labs (07~13)</h1>
      <p>
        Lab 07-13 고급 실습 과정입니다. 데이터 수집부터 워크로드 모니터링까지 
        고급 주제를 단계별로 학습할 수 있습니다.
      </p>
    </header>

    <section>
      <main class="stages" id="labs-stages"></main>
    </section>

  </div>

  <script>
    const labs = [
      {
        lab: "00",
        title: "Azure Databricks 환경 설정",
        md: "00-setup.md",
        minutes: "15 min",
        note: "Azure Cloud Shell에서 스크립트를 실행해 Databricks Premium 작업 영역과 리소스 그룹을 프로비저닝합니다.",
        notebook: "01-explore-azure-databricks-KO.ipynb"
      },
      {
        lab: "07",
        title: "Unity Catalog에 데이터 수집",
        md: "07-ingest-data-into-unity-catalog-KO.md",
        minutes: "50 min",
        note: "PySpark DataFrames, SQL COPY INTO, CREATE TABLE AS SELECT를 사용해 CSV 파일을 Delta 테이블로 로드하고, Auto Loader로 지속적인 데이터 수집을 구성합니다.",
        notebook: "07-ingest-data-into-unity-catalog-KO.ipynb"
      },
      {
        lab: "08",
        title: "Unity Catalog로 데이터 정제, 변환 및 로드",
        md: "08-cleanse-transform-load-data-into-unity-catalog-KO.md",
        minutes: "50 min",
        note: "부동산 데이터를 정제하고 PySpark로 중복을 제거하며, 조인과 PIVOT/UNPIVOT으로 트렌드 분석을 위해 데이터를 재구성합니다.",
        notebook: "08-cleanse-transform-load-data-into-unity-catalog-KO.ipynb"
      },
      {
        lab: "09",
        title: "Unity Catalog에서 데이터 품질 제약 조건 구현 및 관리",
        md: "09-implement-manage-data-quality-constraints-unity-catalog-KO.md",
        minutes: "50 min",
        note: "Lakeflow 선언형 파이프라인에서 데이터 품질 제약 조건을 구현하고, 널 검사, 범위 검증, 스키마 드리프트를 처리합니다.",
        notebook: "09-implement-manage-data-quality-constraints-unity-catalog-KO.ipynb"
      },
      {
        lab: "10",
        title: "Azure Databricks를 사용한 데이터 파이프라인 설계 및 구현",
        md: "10-design-implement-data-pipelines-KO.md",
        minutes: "50",
        note: "메달리온 아키텍처 파이프라인(Bronze→Silver→Gold)을 구축하고, 오류 처리·매개변수화·Lakeflow 작업 오케스트레이션을 구현합니다.",
        notebook: "10-design-implement-data-pipelines-KO.ipynb"
      },
      {
        lab: "11",
        title: "Azure Databricks로 Lakeflow 작업 구현",
        md: "11-implement-lakeflow-jobs-KO.md",
        minutes: "50 min",
        note: "Lakeflow 작업으로 CDR 데이터 파이프라인을 자동화하고, 작업 종속성·예약·이벤트 기반 트리거·실패 알림을 구성합니다.",
        notebook: "11-implement-lakeflow-jobs-KO.ipynb"
      },
      {
        lab: "12",
        title: "Azure Databricks에서 개발 수명 주기 프로세스 구현",
        md: "12-implement-development-lifecycle-processes-in-azure-databricks-KO.md",
        minutes: "50 min",
        note: "pytest로 데이터 변환 파이프라인 테스트 전략을 구현하고, Databricks CLI로 파이프라인을 자산 번들로 패키징·배포합니다.",
        notebook: "12-implement-development-lifecycle-processes-in-azure-databricks-KO.ipynb"
      },
      {
        lab: "13",
        title: "Azure Databricks에서 워크로드 모니터링, 문제 해결 및 최적화",
        md: "13-monitor-troubleshoot-optimize-workloads-azure-databricks-KO.md",
        minutes: "50 min",
        note: "Spark UI로 성능 문제를 진단하고, 브로드캐스트 조인·적응형 쿼리 실행·셔플 감소 기술로 워크로드를 최적화합니다.",
        notebook: "13-monitor-troubleshoot-optimize-workloads-azure-databricks-KO.ipynb"
      }
    ];

    const stageConfig = [
      { title: "준비", labNumbers: [0] },
      { title: "데이터 수집 및 품질", labNumbers: [7, 8, 9] },
      { title: "파이프라인 및 최적화", labNumbers: [10, 11, 12, 13] }
    ];

    const labsStages = document.getElementById("labs-stages");

    stageConfig.forEach((stage) => {
      const section = document.createElement("section");
      section.className = "stage";

      const title = document.createElement("h3");
      title.className = "stage-title";
      title.textContent = stage.title;
      section.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";

      labs
        .filter((item) => stage.labNumbers.includes(Number(item.lab)))
        .forEach((item) => {
          const card = document.createElement("article");
          card.className = "card";

          const badge = item.lab === "00" ? "<span class=\"chip\">Setup</span>" : `<span>${item.minutes}</span>`;

          card.innerHTML = `
            <div class="meta"><strong>Lab ${item.lab}</strong>${badge}</div>
            <h3>${item.title}</h3>
            <p>${item.note}</p>
            <div class="card-links">
              <a href="lab.html?file=Labs/${item.md}">가이드</a>
              <a href="notebook.html?file=Labs/Notebooks/${item.notebook}">노트북</a>
            </div>
          `;

          grid.appendChild(card);
        });

      section.appendChild(grid);
      labsStages.appendChild(section);
    });
  </script>
</body>
</html>
