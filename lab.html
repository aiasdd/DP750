<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Guide Viewer</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f4f4f4;
      --surface: #ffffff;
      --ink: #222222;
      --ink-soft: #666666;
      --border: #dedede;
      --accent: #ac292d;
      --accent-strong: #8e2225;
      --accent-soft: #f8eeee;
      --azure: #0078d4;
      --header-height: 5rem;
      --header-gap: 0.85rem;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", Pretendard, sans-serif;
    }

    body {
      margin: 0;
      font-family: "Pretendard Variable", Pretendard, sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .layout {
      width: min(1560px, calc(100% - 2rem));
      margin: 0 auto;
      height: 100vh;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 3px solid var(--accent);
      padding: 0.75rem clamp(1rem, 2.5vw, 3.125rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      position: fixed;
      inset: 0 0 auto;
      width: 100%;
      min-height: var(--header-height);
      margin-bottom: 0;
      z-index: 20;
    }

    .topbar-title {
      min-width: 0;
      margin: 0;
      color: #1a1a1a;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 0 0 auto;
    }

    .nav-button {
      display: inline-flex;
      min-height: 2.5rem;
      align-items: center;
      justify-content: center;
      padding: 0.3rem 0.8rem;
      border: 1px solid #d4d4d4;
      border-radius: 0.65rem;
      background: #fff;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .nav-button:hover:not([aria-disabled="true"]) {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .nav-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .nav-button.home {
      color: var(--azure);
    }

    .nav-button.home:hover {
      background: #eef7ff;
      border-color: var(--azure);
    }

    .nav-button[aria-disabled="true"] {
      color: #a6a6a6;
      cursor: default;
    }

    .topbar .path {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(1.25rem, 3.8vw, 4.5rem) 1.5rem;
      line-height: 1.8;
      color: #222;
      overflow-x: auto;
    }

    .error {
      color: #b00020;
      font-weight: 600;
    }

    .content h1,
    .content h2,
    .content h3 {
      line-height: 1.3;
    }

    .content h1 {
      margin: 0 0 1.8rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: clamp(1.5rem, 2vw, 2.15rem);
    }

    .content h2 {
      margin: 2.8rem 0 1.3rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid #dedede;
      color: #222;
      font-size: clamp(1.35rem, 1.8vw, 1.8rem);
    }

    .content h3 {
      margin: 2rem 0 0.9rem;
      color: #333;
      font-size: 1.25rem;
    }

    .content p {
      margin: 0 0 1rem;
    }

    .content blockquote {
      margin: 1.2rem 0 1.6rem;
      padding: 0.8rem 1rem;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      color: #4e4e4e;
    }

    .content blockquote p:last-child {
      margin-bottom: 0;
    }

    .content ol,
    .content ul {
      padding-left: 1.8rem;
    }

    .content li {
      padding-left: 0.1rem;
      margin: 0.35rem 0;
    }

    .content li::marker {
      color: var(--accent-strong);
    }

    .content a {
      color: var(--azure);
    }

    .content hr {
      margin: 2rem 0;
      border: 0;
      border-top: 1px solid #dedede;
    }

    .content > hr:first-child {
      display: none;
    }

    .content table {
      border-collapse: collapse;
      width: 100%;
    }

    .content th,
    .content td {
      border: 1px solid #dedede;
      padding: 0.45rem 0.55rem;
      text-align: left;
    }

    .content th {
      background: #f7f7f7;
    }

    .content th:first-child,
    .content td:first-child {
      white-space: nowrap;
      width: 110px;
    }

    .content code {
      background: #f0f0f0;
      padding: 0.1rem 0.28rem;
      border-radius: 4px;
      font-size: 13px;
    }

    .content code.inline-code-copy {
      position: relative;
      display: inline-block;
      cursor: copy;
    }

    .content code.inline-code-copy:hover,
    .content code.inline-code-copy:focus-visible {
      background: var(--accent-soft);
      outline: none;
    }

    .content code.inline-code-copy::after {
      position: absolute;
      z-index: 2;
      right: 0;
      bottom: calc(100% + 0.4rem);
      display: none;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: #333;
      color: #fff;
      content: attr(data-copy-label);
      font: 0.75rem "Pretendard Variable", Pretendard, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    .content code.inline-code-copy:hover::after,
    .content code.inline-code-copy:focus-visible::after {
      display: block;
    }

    .content code,
    .content pre,
    .content kbd,
    .content samp {
      font-family: Consolas, "Pretendard Variable", Pretendard, "Courier New", monospace;
    }

    .content pre {
      background: #f5f5f5;
      color: #222;
      border: 1px solid var(--border);
      padding: 0.5rem 4rem 0.5rem 0.9rem;
      font-size: 0.9rem;
      line-height: 1.6;
      border-radius: 10px;
      overflow-x: auto;
    }

    .content pre code {
      background: transparent;
      color: inherit;
      font-size: inherit;
      padding: 0;
    }

    .content img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .content img[alt="assistant-icon"],
    .content img[alt="assistant icon"] {
      display: inline-block;
      width: 1.05em;
      height: 1.05em;
      max-width: none;
      margin: 0 0.15em;
      vertical-align: text-bottom;
    }

    .code-block-wrap {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: calc(0.5rem + 1px);
      right: 0.45rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 1.44rem;
      border: 1px solid #999;
      background: #fff;
      color: #222;
      border-radius: 6px;
      padding: 0 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #ededed;
      border-color: #666;
    }

    .copy-btn:focus-visible {
      outline: 2px solid #666;
      outline-offset: 2px;
    }

    .main-container {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      margin-top: calc(var(--header-height) + var(--header-gap));
      height: calc(100vh - var(--header-height) - var(--header-gap) - 1rem);
      overflow: hidden;
    }

    .toc-sidebar {
      flex: 0 0 240px;
      max-height: 100%;
      overflow-y: auto;
    }

    .toc {
      background: var(--surface);
      border: 1px solid #dedede;
      border-radius: 14px;
      overflow: hidden;
    }

    .toc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #e3e3e3;
    }

    .toc-title {
      border: 0;
      padding: 0;
      background: transparent;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a1a;
      cursor: pointer;
    }

    .toc-sidebar.is-collapsed {
      flex-basis: 64px;
    }

    .toc-sidebar.is-collapsed .toc-header {
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 0.5rem;
      border-bottom: 0;
    }

    .toc-sidebar.is-collapsed .toc-title {
      writing-mode: vertical-rl;
    }

    .toc-toggle {
      border: 0;
      padding: 0 0.2rem;
      background: transparent;
      color: #666;
      font: inherit;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0.75rem 0.5rem 1rem;
    }

    .toc-item {
      margin: 0;
      padding: 0;
    }

    .toc-link {
      display: block;
      padding: 0.45rem 0.5rem;
      color: #666;
      text-decoration: none;
      font-size: 0.85rem;
      line-height: 1.5;
      border-left: 3px solid transparent;
      transition: color 0.15s, background-color 0.15s, border-color 0.15s;
    }

    .toc-link:hover {
      color: #333;
      background: var(--accent-soft);
      border-left-color: var(--accent);
    }

    .toc-link.level-1 {
      margin-left: 0;
      font-weight: 600;
      margin-top: 0.3rem;
    }

    .toc-link.level-2 {
      margin-left: 0;
    }

    .toc-link.level-3 {
      margin-left: 0.8rem;
    }

    .toc-link.level-4 {
      margin-left: 1.6rem;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      max-height: 100%;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    @media (max-width: 768px) {
      :root {
        --header-height: 7rem;
        --header-gap: 0.5rem;
      }

      body {
        overflow: auto;
      }

      .layout {
        height: auto;
      }

      .topbar {
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.55rem 1rem;
      }

      .topbar-title {
        flex: 0 0 100%;
        text-align: center;
        font-size: 1.1rem;
      }

      .topbar-nav {
        justify-content: center;
        width: 100%;
      }

      .nav-button {
        min-height: 2.35rem;
        padding: 0.25rem 0.65rem;
        font-size: 0.9rem;
      }

      .content {
        padding: 1.2rem;
      }

      .main-container {
        flex-direction: column;
        margin-top: calc(var(--header-height) + var(--header-gap));
        height: auto;
        overflow: visible;
      }

      .toc-sidebar {
        flex: 1 1 auto;
        max-height: 300px;
      }

      .toc-sidebar.is-collapsed {
        flex: 0 0 auto;
        width: 64px;
      }

      .content-area {
        max-height: none;
        overflow: visible;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <strong class="topbar-title" id="page-title">문서 불러오는 중...</strong>
      <nav class="topbar-nav" aria-label="문서 이동">
        <a class="nav-button" id="prev-link" aria-disabled="true" tabindex="-1">← 이전</a>
        <a class="nav-button home" href="./index.html">홈으로 가기</a>
        <a class="nav-button" id="next-link" aria-disabled="true" tabindex="-1">다음 →</a>
      </nav>
    </header>

    <div class="main-container">
      <aside class="toc-sidebar">
        <nav class="toc" id="toc" style="display: none;">
          <div class="toc-header">
            <button class="toc-title" id="toc-title" type="button" aria-label="목차 접기" aria-expanded="true" aria-controls="toc-list">목차</button>
            <button class="toc-toggle" id="toc-toggle" type="button" aria-label="목차 접기" aria-expanded="true" aria-controls="toc-list">−</button>
          </div>
          <ul class="toc-list" id="toc-list"></ul>
        </nav>
      </aside>

      <article class="content-area">
        <div class="content" id="content">로딩 중...</div>
      </article>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "";
    const content = document.getElementById("content");
    const pageTitle = document.getElementById("page-title");
    const contentArea = document.querySelector(".content-area");
    const tocNav = document.getElementById("toc");
    const tocList = document.getElementById("toc-list");
    const tocToggle = document.getElementById("toc-toggle");
    const tocTitle = document.getElementById("toc-title");
    const tocSidebar = document.querySelector(".toc-sidebar");
    const headings = [];
    const guideFiles = [
      "00-setup.md",
      "01-explore-azure-databricks-KO.md",
      "02-select-and-configure-compute-KO.md",
      "03-create-and-organize-objects-in-unity-catalog-KO.md",
      "04-secure-unity-catalog-objects-KO.md",
      "05-govern-unity-catalog-objects-KO.md",
      "06-design-implement-data-modeling-unity-catalog-KO.md",
      "07-ingest-data-into-unity-catalog-KO.md",
      "08-cleanse-transform-load-data-into-unity-catalog-KO.md",
      "09-implement-manage-data-quality-constraints-unity-catalog-KO.md",
      "10-design-implement-data-pipelines-KO.md",
      "11-implement-lakeflow-jobs-KO.md",
      "12-implement-development-lifecycle-processes-in-azure-databricks-KO.md",
      "13-monitor-troubleshoot-optimize-workloads-azure-databricks-KO.md",
    ];

    const isAllowedPath = file.startsWith("Labs/") && file.endsWith(".md") && !file.includes("..");

    function toggleToc() {
      const isExpanded = tocToggle.getAttribute("aria-expanded") === "true";
      [tocToggle, tocTitle].forEach((button) => {
        button.setAttribute("aria-expanded", String(!isExpanded));
        button.setAttribute("aria-label", isExpanded ? "목차 펼치기" : "목차 접기");
      });
      tocToggle.textContent = isExpanded ? "+" : "−";
      tocList.hidden = isExpanded;
      tocSidebar.classList.toggle("is-collapsed", isExpanded);
    }

    tocToggle.addEventListener("click", toggleToc);
    tocTitle.addEventListener("click", toggleToc);

    function setNavigationLink(link, targetFile) {
      if (!targetFile) {
        link.removeAttribute("href");
        link.setAttribute("aria-disabled", "true");
        link.tabIndex = -1;
        return;
      }

      link.href = `lab.html?file=${encodeURIComponent(`Labs/${targetFile}`)}`;
      link.removeAttribute("aria-disabled");
      link.removeAttribute("tabindex");
    }

    const currentGuideIndex = guideFiles.indexOf(file.slice("Labs/".length));
    setNavigationLink(
      document.getElementById("prev-link"),
      currentGuideIndex > 0 ? guideFiles[currentGuideIndex - 1] : null
    );
    setNavigationLink(
      document.getElementById("next-link"),
      currentGuideIndex >= 0 && currentGuideIndex < guideFiles.length - 1
        ? guideFiles[currentGuideIndex + 1]
        : null
    );

    function stripFrontMatter(markdown) {
      return markdown.replace(/^\uFEFF?---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");
    }

    function replaceAdmonitionLabels(markdown) {
      const icons = {
        NOTE: "ℹ️",
        TIP: "💡",
        IMPORTANT: "❗",
        WARNING: "⚠️",
        CAUTION: "🛑",
      };
      return markdown.replace(
        /^(\s*>[ \t]*)\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*$/gim,
        (_match, prefix, label) => `${prefix}${icons[label.toUpperCase()]}`
      );
    }

    function addSpaceAfterBoldParticles(markdown) {
      let fenceMarker = "";
      let fenceLength = 0;

      return markdown.split("\n").map((line) => {
        const fence = line.match(/^\s*(`{3,}|~{3,})/);
        if (fence) {
          const marker = fence[1][0];
          if (!fenceMarker) {
            fenceMarker = marker;
            fenceLength = fence[1].length;
          } else if (marker === fenceMarker && fence[1].length >= fenceLength) {
            fenceMarker = "";
            fenceLength = 0;
          }
          return line;
        }

        if (fenceMarker) return line;

        return line.replace(/(`+)(.*?)\1|(\*\*[^*\r\n]+\*\*)(를|을|로)/g, (match, ticks, code, bold, particle) =>
          ticks ? match : `${bold} ${particle}`
        );
      }).join("\n");
    }

    function resolveRelativePath(path, baseDir) {
      if (!path || /^(https?:|mailto:|tel:|#|data:)/i.test(path)) {
        return path;
      }
      const resolved = new URL(path, `${window.location.origin}/${baseDir}/`);
      return `${resolved.pathname}${resolved.search}${resolved.hash}`.replace(/^\/+/, "");
    }

    function toGuideViewerUrl(originalHref, markdownPath) {
      if (!originalHref || /^(mailto:|tel:|#|data:)/i.test(originalHref)) {
        return originalHref;
      }

      const baseDir = markdownPath.split("/").slice(0, -1).join("/");
      let normalizedPath = "";

      if (/^https?:/i.test(originalHref)) {
        const url = new URL(originalHref);
        const prefix = "/AzureDatabricks/";
        if (!url.pathname.includes("/Labs/") || !url.pathname.endsWith(".md")) {
          return originalHref;
        }
        normalizedPath = url.pathname.includes(prefix)
          ? url.pathname.slice(url.pathname.indexOf(prefix) + prefix.length)
          : url.pathname.replace(/^\/+/, "");
      } else {
        normalizedPath = resolveRelativePath(originalHref, baseDir);
      }

      if (!normalizedPath.endsWith(".md")) {
        return originalHref;
      }

      return `lab.html?file=${encodeURIComponent(normalizedPath)}`;
    }

    function rewriteRelativeUrls(html, markdownPath) {
      const baseDir = markdownPath.split("/").slice(0, -1).join("/");
      const temp = document.createElement("div");
      temp.innerHTML = html;

      temp.querySelectorAll("img").forEach((img) => {
        const src = img.getAttribute("src");
        img.setAttribute("src", resolveRelativePath(src, baseDir));
      });

      temp.querySelectorAll("a").forEach((a) => {
        const href = a.getAttribute("href");
        const guideViewerHref = toGuideViewerUrl(href, markdownPath);
        if (guideViewerHref !== href) {
          a.setAttribute("href", guideViewerHref);
          return;
        }
        a.setAttribute("href", resolveRelativePath(href, baseDir));
      });

      return temp.innerHTML;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        if (!document.execCommand("copy")) {
          throw new Error("클립보드에 복사하지 못했습니다.");
        }
      } finally {
        document.body.removeChild(textarea);
      }
    }

    function addInlineCodeCopy(root) {
      root.querySelectorAll("code").forEach((code) => {
        if (code.closest("pre")) return;

        code.classList.add("inline-code-copy");
        code.dataset.copyLabel = "클릭하여 복사";
        code.title = "클릭하여 복사";
        code.tabIndex = 0;
        code.setAttribute("role", "button");
        code.setAttribute("aria-label", `코드 복사: ${code.textContent}`);

        const copy = async () => {
          try {
            await copyText(code.textContent || "");
            code.dataset.copyLabel = "복사됨";
          } catch (_error) {
            code.dataset.copyLabel = "복사 실패";
          }

          setTimeout(() => {
            code.dataset.copyLabel = "클릭하여 복사";
          }, 1200);
        };

        code.addEventListener("click", copy);
        code.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            copy();
          }
        });
      });
    }

    function addCopyButtons(root) {
      root.querySelectorAll("pre").forEach((pre) => {
        const code = pre.querySelector("code");
        if (!code) return;

        const wrap = document.createElement("div");
        wrap.className = "code-block-wrap";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.textContent = "복사";

        button.addEventListener("click", async () => {
          try {
            await copyText(code.textContent || "");
            button.textContent = "복사됨";
            setTimeout(() => {
              button.textContent = "복사";
            }, 1200);
          } catch (_error) {
            button.textContent = "실패";
            setTimeout(() => {
              button.textContent = "복사";
            }, 1200);
          }
        });

        wrap.appendChild(button);
      });
    }

    function extractHeadings(html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      const headingElements = temp.querySelectorAll("h1, h2, h3, h4");
      headingElements.forEach((h, idx) => {
        if (idx === 0) return; // 첫 번째 헤딩 스킵
        const level = parseInt(h.tagName[1]);
        const id = `heading-${idx}`;
        h.id = id;
        headings.push({
          id,
          level,
          text: h.textContent,
        });
      });
      return temp.innerHTML;
    }

    function renderTOC() {
      if (headings.length === 0) {
        tocNav.style.display = "none";
        return;
      }

      tocNav.style.display = "block";
      tocList.innerHTML = "";

      headings.forEach((h) => {
        const li = document.createElement("li");
        li.className = "toc-item";
        const a = document.createElement("a");
        a.href = `#${h.id}`;
        a.className = `toc-link level-${h.level}`;
        a.textContent = h.text;
        a.addEventListener("click", (event) => {
          event.preventDefault();
          scrollToHeading(h.id);
          history.replaceState(null, "", `#${h.id}`);
        });
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    function scrollToHeading(id) {
      const target = document.getElementById(id);
      if (!target || !contentArea) return;
      const offsetTop = target.getBoundingClientRect().top - contentArea.getBoundingClientRect().top + contentArea.scrollTop - 8;
      contentArea.scrollTop = offsetTop;
    }

    if (!isAllowedPath) {
      content.innerHTML = '<p class="error">잘못된 문서 경로입니다.</p>';
      throw new Error("Invalid file path");
    }

    fetch(file)
      .then((response) => {
        if (!response.ok) {
          throw new Error("문서를 불러오지 못했습니다.");
        }
        return response.text();
      })
      .then((markdown) => {
        const cleanMarkdown = addSpaceAfterBoldParticles(
          replaceAdmonitionLabels(stripFrontMatter(markdown))
        );
        let html = marked.parse(cleanMarkdown);
        html = rewriteRelativeUrls(html, file);
        html = extractHeadings(html);
        content.innerHTML = html;
        const title = content.querySelector("h1")?.textContent?.trim().replace(/^랩\s*\d+\s*:\s*/i, "")
          || file.split("/").pop().replace(/\.md$/i, "");
        pageTitle.textContent = title;
        document.title = `${title} | Azure Databricks Labs`;
        addInlineCodeCopy(content);
        addCopyButtons(content);
        renderTOC();
        if (window.location.hash) {
          scrollToHeading(window.location.hash.slice(1));
        }
      })
      .catch((error) => {
        content.innerHTML = `<p class="error">${error.message}</p>`;
        tocNav.style.display = "none";
      });
  </script>
</body>
</html>
