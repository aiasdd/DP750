<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Guide Viewer</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --ink: #1b2432;
      --ink-soft: #5a6b84;
      --border: #dbe4f1;
      --accent: #0a6cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .layout {
      width: min(980px, calc(100% - 2rem));
      margin: 1.4rem auto 3rem;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .topbar a {
      text-decoration: none;
      color: #0a3b89;
      font-weight: 600;
    }

    .topbar .path {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      line-height: 1.7;
      overflow-x: auto;
    }

    .error {
      color: #b00020;
      font-weight: 600;
    }

    .content h1,
    .content h2,
    .content h3 {
      line-height: 1.3;
    }

    .content table {
      border-collapse: collapse;
      width: 100%;
    }

    .content th,
    .content td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.55rem;
      text-align: left;
    }

    .content code {
      background: #eef3ff;
      padding: 0.1rem 0.28rem;
      border-radius: 4px;
    }

    .content pre {
      background: #0f1724;
      color: #f3f7ff;
      padding: 0.9rem;
      border-radius: 10px;
      overflow-x: auto;
    }

    .content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .code-block-wrap {
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(11, 47, 115, 0.9);
      color: #f3f7ff;
      border-radius: 8px;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: rgba(8, 37, 89, 0.95);
    }

    .main-container {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }

    .toc-sidebar {
      flex: 0 0 240px;
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
    }

    .toc {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .toc-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.8rem;
    }

    .toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .toc-item {
      margin: 0;
      padding: 0;
    }

    .toc-link {
      display: block;
      padding: 0.4rem 0;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      line-height: 1.5;
      border-left: 2px solid transparent;
      padding-left: 0.5rem;
      transition: all 0.15s;
    }

    .toc-link:hover {
      color: #0054cc;
      border-left-color: var(--accent);
    }

    .toc-link.level-1 {
      margin-left: 0;
      font-weight: 600;
      margin-top: 0.3rem;
    }

    .toc-link.level-2 {
      margin-left: 0.8rem;
    }

    .toc-link.level-3 {
      margin-left: 1.6rem;
    }

    .toc-link.level-4 {
      margin-left: 2.4rem;
    }

    .content-area {
      flex: 1;
      min-width: 0;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .toc-sidebar {
        flex: 1 1 auto;
        position: static;
        max-height: 300px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="layout">
    <div class="topbar">
      <a href="./index.html">메인으로 돌아가기</a>
      <span class="path" id="doc-path"></span>
    </div>

    <div class="main-container">
      <aside class="toc-sidebar">
        <nav class="toc" id="toc" style="display: none;">
          <div class="toc-title">목차</div>
          <ul class="toc-list" id="toc-list"></ul>
        </nav>
      </aside>

      <article class="content-area">
        <div class="content" id="content">로딩 중...</div>
      </article>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "";
    const content = document.getElementById("content");
    const docPath = document.getElementById("doc-path");
    const tocNav = document.getElementById("toc");
    const tocList = document.getElementById("toc-list");
    const headings = [];

    const isAllowedPath = file.startsWith("Labs/") && file.endsWith(".md") && !file.includes("..");

    function stripFrontMatter(markdown) {
      return markdown.replace(/^\uFEFF?---\r?\n[\s\S]*?\r?\n---\r?\n?/, "");
    }

    function resolveRelativePath(path, baseDir) {
      if (!path || /^(https?:|mailto:|tel:|#|data:)/i.test(path)) {
        return path;
      }
      const resolved = new URL(path, `${window.location.origin}/${baseDir}/`);
      return `${resolved.pathname}${resolved.search}${resolved.hash}`.replace(/^\/+/, "");
    }

    function toGuideViewerUrl(originalHref, markdownPath) {
      if (!originalHref || /^(mailto:|tel:|#|data:)/i.test(originalHref)) {
        return originalHref;
      }

      const baseDir = markdownPath.split("/").slice(0, -1).join("/");
      let normalizedPath = "";

      if (/^https?:/i.test(originalHref)) {
        const url = new URL(originalHref);
        const prefix = "/AzureDatabricks/";
        if (!url.pathname.includes("/Labs/") || !url.pathname.endsWith(".md")) {
          return originalHref;
        }
        normalizedPath = url.pathname.includes(prefix)
          ? url.pathname.slice(url.pathname.indexOf(prefix) + prefix.length)
          : url.pathname.replace(/^\/+/, "");
      } else {
        normalizedPath = resolveRelativePath(originalHref, baseDir);
      }

      if (!normalizedPath.endsWith(".md")) {
        return originalHref;
      }

      return `lab.html?file=${encodeURIComponent(normalizedPath)}`;
    }

    function rewriteRelativeUrls(html, markdownPath) {
      const baseDir = markdownPath.split("/").slice(0, -1).join("/");
      const temp = document.createElement("div");
      temp.innerHTML = html;

      temp.querySelectorAll("img").forEach((img) => {
        const src = img.getAttribute("src");
        img.setAttribute("src", resolveRelativePath(src, baseDir));
      });

      temp.querySelectorAll("a").forEach((a) => {
        const href = a.getAttribute("href");
        const guideViewerHref = toGuideViewerUrl(href, markdownPath);
        if (guideViewerHref !== href) {
          a.setAttribute("href", guideViewerHref);
          return;
        }
        a.setAttribute("href", resolveRelativePath(href, baseDir));
      });

      return temp.innerHTML;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);
    }

    function addCopyButtons(root) {
      root.querySelectorAll("pre").forEach((pre) => {
        const code = pre.querySelector("code");
        if (!code) return;

        const wrap = document.createElement("div");
        wrap.className = "code-block-wrap";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.textContent = "복사";

        button.addEventListener("click", async () => {
          try {
            await copyText(code.textContent || "");
            button.textContent = "복사됨";
            setTimeout(() => {
              button.textContent = "복사";
            }, 1200);
          } catch (_error) {
            button.textContent = "실패";
            setTimeout(() => {
              button.textContent = "복사";
            }, 1200);
          }
        });

        wrap.appendChild(button);
      });
    }

    function extractHeadings(html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      const headingElements = temp.querySelectorAll("h1, h2, h3, h4");
      headingElements.forEach((h, idx) => {
        if (idx === 0) return; // 첫 번째 헤딩 스킵
        const level = parseInt(h.tagName[1]);
        const id = `heading-${idx}`;
        h.id = id;
        headings.push({
          id,
          level,
          text: h.textContent,
        });
      });
      return temp.innerHTML;
    }

    function renderTOC() {
      if (headings.length === 0) {
        tocNav.style.display = "none";
        return;
      }

      tocNav.style.display = "block";
      tocList.innerHTML = "";

      headings.forEach((h) => {
        const li = document.createElement("li");
        li.className = "toc-item";
        const a = document.createElement("a");
        a.href = `#${h.id}`;
        a.className = `toc-link level-${h.level}`;
        a.textContent = h.text;
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    if (!isAllowedPath) {
      content.innerHTML = '<p class="error">잘못된 문서 경로입니다.</p>';
      throw new Error("Invalid file path");
    }

    docPath.textContent = file;

    fetch(file)
      .then((response) => {
        if (!response.ok) {
          throw new Error("문서를 불러오지 못했습니다.");
        }
        return response.text();
      })
      .then((markdown) => {
        const cleanMarkdown = stripFrontMatter(markdown);
        let html = marked.parse(cleanMarkdown);
        html = rewriteRelativeUrls(html, file);
        html = extractHeadings(html);
        content.innerHTML = html;
        addCopyButtons(content);
        renderTOC();
      })
      .catch((error) => {
        content.innerHTML = `<p class="error">${error.message}</p>`;
        tocNav.style.display = "none";
      });
  </script>
</body>
</html>
